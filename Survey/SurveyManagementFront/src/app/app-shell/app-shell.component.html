<div class="app-shell" >

    <!-- ─── Header ─────────────────────────────────────────────────── -->
    <div class="app-shell-header">
        <app-header></app-header>
    </div>

    <!-- ─── Body ─────────────────────────────────────────────────────
       RTL: flex-direction:row → اولین فرزند (sidebar) سمت راست قرار می‌گیرد
  ──────────────────────────────────────────────────────────────── -->
    <div class="app-shell-body">
        <app-sidebar [open]="sidebarOpen()" (close)="sidebarOpen.set(false)"></app-sidebar>
        <button type="button" class="sidebar-fab" (click)="sidebarOpen.set(true)" aria-label="باز کردن منو">
            <i class="fas fa-bars"></i>
        </button>

        <main class="app-shell-main">
            <div class="content-wrapper">
                <div class="content-container">
                    <router-outlet></router-outlet>
                </div>
            </div>
        </main>
    </div>

    <!-- ─── Footer ─────────────────────────────────────────────────── -->
    <footer class="app-footer">
        <div class="footer-container">
            <div class="footer-left">
                <div class="footer-logo"><i class="fas fa-poll"></i></div>
                <div class="footer-info">
                    <p class="footer-brand">سامانه نظرسنجی</p>
                    <p class="footer-copyright">© {{ currentYear }}</p>
                </div>
            </div>
            <div class="footer-right">
                <div class="footer-links">
                    <a class="footer-link" href="#">راهنما</a>
                    <span class="footer-divider">•</span>
                    <a class="footer-link" href="#">پشتیبانی</a>
                </div>
                <p class="footer-version">نسخه ۱.۰.۰</p>
            </div>
        </div>
    </footer>

    <!-- ─── Loading ────────────────────────────────────────────────── -->
    <app-loading-bar></app-loading-bar>

    <!-- ─── Offline ─────────────────────────────────────────────────── -->
    @if (!isOnline()) {
    <div class="offline-indicator">
        <div class="offline-content">
            <i class="fas fa-wifi-slash"></i>
            <span>اتصال اینترنت قطع است</span>
        </div>
    </div>
    }
</div>
