<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">

  <!-- Title & Description -->
  <title>سامانه مدیریت نظرسنجی | Survey Management System</title>
  <meta name="description" content="سیستم جامع مدیریت نظرسنجی با امکانات پیشرفته">
  <meta name="keywords" content="نظرسنجی, مدیریت نظرسنجی, Survey, Survey Management">

  <!-- Favicon -->
  <base href="/">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">

  <!-- Theme Color -->
  <meta name="theme-color" content="#667eea">
  <meta name="apple-mobile-web-app-status-bar-style" content="#667eea">

  <link rel="stylesheet" href="vendor/fonts/fontawesome.css" />

  <link rel="stylesheet" href="libs/toastr/toastr.css">
  <link rel="stylesheet" href="libs/sweetalert2/sweetalert2.css">

  <!-- Preload Critical Resources -->
  <link rel="stylesheet" as="style" href="css/app.css">

  <!-- Global Styles -->
  <style>
   

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    body {
      font-family: 'Inter', 'Sahel', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 1rem;
      line-height: 1.6;
      color: #1f2937;
      /* background: #f9fafb; */
      direction: rtl;
      overflow-x: hidden;
      min-height: 100vh;
    }

    

    .app-loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      z-index: 9999;
    }

    .loading-content {
      text-align: center;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .loading-logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 2rem;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      color: white;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.05);
      }
    }

    .loading-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: white;
      margin-bottom: 0.5rem;
    }

    .loading-subtitle {
      font-size: 0.875rem;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 2rem;
      letter-spacing: 1px;
    }

    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      margin: 0 auto;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    ::-webkit-scrollbar {
      width: 12px;
      height: 12px;
    }

    ::-webkit-scrollbar-track {
      background: #f3f4f6;
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 10px;
      border: 2px solid #f3f4f6;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(135deg, #5568d3 0%, #664096 100%);
    }

    /* Firefox */
    * {
      scrollbar-width: thin;
      scrollbar-color: #667eea #f3f4f6;
    }
    ::selection {
      background: rgba(102, 126, 234, 0.2);
      color: #667eea;
    }

    ::-moz-selection {
      background: rgba(102, 126, 234, 0.2);
      color: #667eea;
    }

    @media print {
      body {
        background: white;
      }

      .app-loading {
        display: none !important;
      }
    }
  </style>
  <link rel="stylesheet" href="libs/jalaliDatePicker/jalalidatepicker.min.css">

</head>

<body>
  <app-root>
    <div class="app-loading">
      <div class="loading-content">
        <div class="loading-logo">
          <i class="fas fa-poll-h"></i>
        </div>
        <h1 class="loading-title">سامانه مدیریت نظرسنجی</h1>
        <p class="loading-subtitle">Survey Management System</p>
        <div class="loading-spinner"></div>
      </div>
    </div>
  </app-root>

  <noscript>
    <div style="
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1f2937;
      color: white;
      font-family: sans-serif;
      text-align: center;
      padding: 2rem;
    ">
      <div>
        <h1 style="font-size: 2rem; margin-bottom: 1rem;">JavaScript غیرفعال است</h1>
        <p style="font-size: 1.125rem; opacity: 0.8;">
          برای استفاده از این سامانه، لطفاً JavaScript را در مرورگر خود فعال کنید.
        </p>
      </div>
    </div>
  </noscript>
  <script src="js/jquery.js"></script>
  <script src="libs/sweetalert2/sweetalert2.js"></script>
  <script src="libs/jalaliDatePicker/jalalidatepicker.min.js"></script>

  <script>
    jalaliDatepicker.startWatch({
      minDate: "attr",
      maxDate: "attr",
      minTime: "attr",
      maxTime: "attr",
      hideAfterChange: true,
      autoHide: true,
      showTodayBtn: true,
      showEmptyBtn: true,
      topSpace: 10,
      bottomSpace: 30,
      dayRendering(opt, input) {
        return {
          isHollyDay: opt.day == 1
        }
      }
    });
  </script>
</body>

</html>
