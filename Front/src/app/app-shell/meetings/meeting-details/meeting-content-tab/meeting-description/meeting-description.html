<div class="card flex-fill desc-card">
  <div class="card-header d-flex align-items-center justify-content-between">
    <h5 class="mb-0"><i class="fa fa-align-right ms-2 text-primary"></i>شرح جلسه</h5>
    @if (canEditDescription() && !canShowDescriptionTextArea()) {
    <button type="button" class="btn btn-outline-primary btn-sm" (click)="editMeetingDescription()">
      <i class="fa fa-pen ms-1"></i>ویرایش
    </button>
    }
  </div>
  <div class="card-body desc-body">
    @if (canShowDescription()) {
    <app-rich-text-view [value]="description()" />
    }

    @if (canShowDescriptionTextArea()) {
    <app-rich-text-editor [ngModel]="editableDescription()" (ngModelChange)="onDescriptionChange($event)"
      [maxLength]="2000" [minHeight]="320" [maxHeight]="460"
      placeholder="شرح مذاکرات و روند جلسه را بنویسید… (عنوان، فهرست و قالب‌بندی پشتیبانی می‌شود)" />

    <div class="d-flex justify-content-end gap-2 mt-3">
      @if (isEditingDescription() && description()) {
      <button type="button" class="btn btn-label-secondary" (click)="cancelEditMeetingDescription()">انصراف</button>
      }
      <button type="button" class="btn btn-success" [disabled]="!descriptionValidation().isValid" (click)="saveMeetingDescription()">
        <i class="fa fa-check ms-1"></i>ثبت شرح جلسه
      </button>
    </div>
    }
  </div>
</div>
