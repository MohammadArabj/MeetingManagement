<div class="members-admin-container">
    <!-- ═══════════════════════════════════════════════════════════════ -->
    <!-- Header Section -->
    <!-- ═══════════════════════════════════════════════════════════════ -->
    <div class="page-header">
        <div class="header-right">
            <button class="btn btn-outline-secondary btn-back" (click)="goBack()">
                <i class="fas fa-arrow-right"></i>
            </button>
            <div class="header-info">
                <h4 class="page-title">
                    <i class="fas fa-users-cog me-2"></i>
                    مدیریت اعضای جلسه
                </h4>
                @if (meeting(); as m) {
                <p class="page-subtitle">
                    {{ m.title }} - {{ m.number }}
                </p>
                }
            </div>
        </div>

        <div class="header-actions">
            <div class="btn-group">
                <button class="btn btn-success" (click)="openAddMemberModal()" style="color: #495461;">
                    افزودن عضو
                </button>
                <button class="btn btn-info" (click)="openAddGuestModal()" style="color: #495461;">
                    افزودن مهمان
                </button>
            </div>

            <div class="btn-group ms-2">
                <button class="btn btn-success" (click)="setGroupAttendance(true)" title="همه حاضر">
                    همه حاضر
                </button>
                <button class="btn btn-danger" (click)="setGroupAttendance(false)" title="همه غایب">
                    همه غایب
                </button>
            </div>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════════════ -->
    <!-- Statistics Cards -->
    <!-- ═══════════════════════════════════════════════════════════════ -->
    <app-member-stats-bar [summary]="summary()"></app-member-stats-bar>

    <!-- ═══════════════════════════════════════════════════════════════ -->
    <!-- Main Content - AG Grid -->
    <!-- ═══════════════════════════════════════════════════════════════ -->
    <div class="card main-card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h5 class="mb-0">
                <i class="fas fa-list me-2"></i>
                لیست اعضا
                @if (loading()) {
                <div class="spinner-border spinner-border-sm ms-2" role="status">
                    <span class="visually-hidden">در حال بارگذاری...</span>
                </div>
                }
            </h5>

            <div class="grid-controls btn-group btn-group-sm">
                <button type="button" class="btn btn-outline-secondary" (click)="onExportExcel()" title="خروجی Excel">
                    <i class="fas fa-file-excel"></i>
                </button>
                <button type="button" class="btn btn-outline-secondary" (click)="removeAllFilters()"
                    title="حذف فیلترها">
                    <i class="fas fa-filter-circle-xmark"></i>
                </button>
            </div>
        </div>

        <div class="card-body p-0">
            @if (loading()) {
            <div class="loading-overlay">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">در حال بارگذاری...</span>
                </div>
                <p class="mt-3 text-muted">در حال بارگذاری لیست اعضا...</p>
            </div>
            } @else if (!hasRecords()) {
            <div class="empty-state">
                <i class="fas fa-users-slash"></i>
                <h5>هیچ عضوی یافت نشد</h5>
                <p>برای شروع، اعضا را به جلسه اضافه کنید.</p>
                <div class="empty-actions">
                    <button class="btn btn-success" (click)="openAddMemberModal()">
                        <i class="fas fa-user-plus me-1"></i>
                        افزودن عضو
                    </button>
                    <button class="btn btn-info" (click)="openAddGuestModal()">
                        <i class="fas fa-user-tie me-1"></i>
                        افزودن مهمان
                    </button>
                </div>
            </div>
            } @else {
            <ag-grid-angular #agGrid class="ag-theme-material ag-grid-custom font-sahel"
                style="height: 600px; width: 100%;" [rowData]="members()" [gridOptions]="gridOptions()"
                [modules]="modules()" (gridReady)="onGridReady($event)">
            </ag-grid-angular>
            }
        </div>
    </div>
</div>

<!-- ═══════════════════════════════════════════════════════════════ -->
<!-- Modals (child components; opened via ViewChild open()/hide()) -->
<!-- ═══════════════════════════════════════════════════════════════ -->
<app-add-member-modal [users]="allUsers()" [members]="members()" [roles]="roles()"
    (save)="saveMember($event)"></app-add-member-modal>

<app-add-guest-modal [users]="allUsers()" [members]="members()"
    (save)="saveGuest($event)"></app-add-guest-modal>

<app-substitute-modal [users]="allUsers()" [members]="members()"
    (save)="saveSubstitute($event)"></app-substitute-modal>

<app-signature-modal [chairmanSigned]="chairmanSigned()"
    (save)="saveSignature($event)"></app-signature-modal>
