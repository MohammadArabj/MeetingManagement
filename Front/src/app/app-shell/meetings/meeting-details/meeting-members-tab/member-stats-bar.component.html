<div class="stats-row">
    <div class="stat-card stat-total">
        <div class="stat-icon">
            <i class="fas fa-users"></i>
        </div>
        <div class="stat-content">
            <span class="stat-value">{{ summary().total }}</span>
            <span class="stat-label">کل اعضا</span>
        </div>
    </div>

    <div class="stat-card stat-internal">
        <div class="stat-icon">
            <i class="fas fa-user-tie"></i>
        </div>
        <div class="stat-content">
            <span class="stat-value">{{ summary().internal }}</span>
            <span class="stat-label">اعضای داخلی</span>
        </div>
    </div>

    <div class="stat-card stat-external">
        <div class="stat-icon">
            <i class="fas fa-user-friends"></i>
        </div>
        <div class="stat-content">
            <span class="stat-value">{{ summary().external }}</span>
            <span class="stat-label">مهمانان</span>
        </div>
    </div>

    <div class="stat-card stat-present">
        <div class="stat-icon">
            <i class="fas fa-user-check"></i>
        </div>
        <div class="stat-content">
            <span class="stat-value">{{ summary().present }}</span>
            <span class="stat-label">حاضرین</span>
        </div>
        <div class="stat-progress">
            <div class="progress-bar"
                [style.width.%]="summary().total > 0 ? (summary().present / summary().total * 100) : 0">
            </div>
        </div>
    </div>

    <div class="stat-card stat-absent">
        <div class="stat-icon">
            <i class="fas fa-user-times"></i>
        </div>
        <div class="stat-content">
            <span class="stat-value">{{ summary().absent }}</span>
            <span class="stat-label">غایبین</span>
        </div>
    </div>

    <div class="stat-card stat-signed">
        <div class="stat-icon">
            <i class="fas fa-signature"></i>
        </div>
        <div class="stat-content">
            <span class="stat-value">{{ summary().signed }}</span>
            <span class="stat-label">امضا کرده</span>
        </div>
    </div>

    <div class="stat-card stat-substitute">
        <div class="stat-icon">
            <i class="fas fa-people-arrows"></i>
        </div>
        <div class="stat-content">
            <span class="stat-value">{{ summary().withSubstitute }}</span>
            <span class="stat-label">دارای جانشین</span>
        </div>
    </div>
</div>
